api_version = "2025-07"

[[extensions]]
name = "Cart quantity limit"
handle = "cart-quantity-limit"
type = "function"
description = "Blocks checkout when a cart line exceeds a maximum quantity."

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/cart_validations_generate_run.graphql"
  export = "cart-validations-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
