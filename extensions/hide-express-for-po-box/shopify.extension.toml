api_version = "2025-07"

[[extensions]]
name = "Hide express for PO Box"
handle = "hide-express-for-po-box"
type = "function"
description = "Hides express and courier delivery options when shipping to a PO Box."

  [[extensions.targeting]]
  target = "cart.delivery-options.transform.run"
  input_query = "src/cart_delivery_options_transform_run.graphql"
  export = "cart-delivery-options-transform-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
