api_version = "2025-07"

[[extensions]]
name = "Hide COD on high-value carts"
handle = "hide-cod-high-value"
type = "function"
description = "Hides Cash on Delivery when the cart total passes a threshold."

  [[extensions.targeting]]
  target = "cart.payment-methods.transform.run"
  input_query = "src/cart_payment_methods_transform_run.graphql"
  export = "cart-payment-methods-transform-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
